name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Any clippy warning fails the build, so the tree stays clean.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all --verbose
      # The same tests with every engine compiling its forms and running them on the VM.
      - name: Test, compiled mode
        run: cargo test --all
        env:
          EELISP_COMPILED: "1"
      - name: Release build
        run: cargo build --release --bin eelisp

  # The engine without its default features: the language alone, for a WebAssembly sandbox.
  language-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (no SQLite, no network)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (no SQLite, no network)
        run: cargo test --no-default-features
      - name: Test (no SQLite, no network), compiled mode
        run: cargo test --no-default-features
        env:
          EELISP_COMPILED: "1"
      - name: Build with SQLite but no network
        run: cargo build --no-default-features --features sqlite
      - name: Build for a bare WebAssembly host
        run: cargo build --no-default-features --target wasm32-unknown-unknown --lib --release
