[package]
name = "eelisp"
version = "0.4.0"
edition = "2021"
description = "A Lisp for personal data management — engine core (Rust rewrite of EELisp)"
authors = ["Roberto Santacroce Martins <roberto@santacroce.xyz>"]
repository = "https://github.com/santacroce-tech/eelisp-rs"
license = "MIT"

# The core is dependency-free and WASM-friendly on purpose: no threads, no I/O in the
# library, no platform types in `Value`. Native/web bindings live in separate crates later.

[lib]
name = "eelisp"
path = "src/lib.rs"

[dependencies]
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled", "serialize"], optional = true }
serde_json = "1.0.151"
ureq = { version = "^2", optional = true }

[features]
default = ["http", "sqlite"]
# `http-get`/`http-post`. Off for the WebAssembly build, where a browser has its own `fetch`.
http = ["dep:ureq"]
# The database, the agenda and sheets, on SQLite. Off, the engine is the language alone: smaller,
# and with no C code, so it builds for any WebAssembly host (a game's mod sandbox, say).
sqlite = ["dep:rusqlite"]
# In a browser, read the clock from JavaScript's `Date.now()`. Off on wasm32-unknown-unknown, the
# host sets the time with `eelisp::dates::set_now`.
js = ["dep:js-sys"]
# Count every frame the VM enters and every builtin it calls, by name (`vm::take_counts`): a
# profile of an EELisp program at its own level (docs/self-hosting/08-profiling-the-compiler.md,
# examples/count_calls.rs). Off by default; it costs a hash lookup per call.
count-calls = []

# In a browser there is no system clock to read: the time comes from JavaScript's Date.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", optional = true }

[[bin]]
name = "eelisp"
path = "src/bin/eelisp.rs"
required-features = ["http", "sqlite"]
